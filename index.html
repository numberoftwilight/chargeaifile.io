<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>낭만빠지 마니또</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  :root{
    --night:#0B0A11;--paper:#F2E9D8;--ink:#241F2E;--seal:#C2453D;--seal-soft:#E0776C;
    --sea:#6BA9C0;--muted:#8B8299;--line:rgba(242,233,216,.13);
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:"Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  }
  body{font-family:var(--sans);background:var(--night);
    background-image:radial-gradient(120% 80% at 50% -8%,#1C2B3B 0%,transparent 58%),
                     radial-gradient(90% 50% at 50% 108%,#2A1A2E 0%,transparent 70%);
    background-attachment:fixed;color:var(--paper);min-height:100vh;line-height:1.5;
    padding:26px 18px calc(48px + env(safe-area-inset-bottom));display:flex;justify-content:center}
  .wrap{width:100%;max-width:450px}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
  h1{font-size:26px;font-weight:800;letter-spacing:-.02em;margin-top:8px}
  h2{font-size:16px;font-weight:800;letter-spacing:-.01em}
  .sub{font-size:13.5px;color:var(--muted);margin-top:7px;line-height:1.65}
  .hr{height:1px;background:var(--line);margin:20px 0}

  .btn{display:block;width:100%;padding:15px;border:0;border-radius:11px;background:var(--paper);
    color:var(--ink);font-family:var(--sans);font-size:15.5px;font-weight:800;cursor:pointer;margin-top:12px}
  .btn:active{transform:scale(.985)}
  .btn.ok{background:var(--seal-soft);color:#2A1113}
  .btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);font-weight:600;font-size:13.5px;padding:12px}
  .btn.ghost:hover{color:var(--paper)}
  .btn[disabled]{opacity:.4;cursor:progress}

  details{border:1px solid var(--line);border-radius:10px;padding:0 14px;margin-top:10px}
  summary{cursor:pointer;padding:13px 0;font-size:13.5px;font-weight:600;color:var(--muted);list-style:none}
  summary::-webkit-details-marker{display:none}
  summary::before{content:"\25B8  ";color:var(--seal-soft)}
  details[open] summary::before{content:"\25BE  "}
  details[open] summary{border-bottom:1px solid var(--line);margin-bottom:12px}
  .pad{padding-bottom:14px}

  .cols{display:flex;gap:14px}
  .col{flex:1;min-width:0}
  .col h4{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--muted);
    padding-bottom:7px;border-bottom:1px solid rgba(242,233,216,.28)}
  .nrow{display:flex;align-items:center;gap:7px;border-bottom:1px solid var(--line)}
  .nrow span{font-family:var(--mono);font-size:10px;color:var(--muted);width:14px;flex:none}
  .nrow input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--paper);
    font-family:var(--sans);font-size:14.5px;font-weight:600;padding:9px 0}
  textarea,.url{width:100%;background:rgba(242,233,216,.05);border:1px solid var(--line);border-radius:8px;
    color:var(--paper);font-family:var(--sans);font-size:13px;line-height:1.75;padding:11px;outline:0}
  textarea{resize:vertical}
  textarea:focus,.url:focus{border-color:var(--seal-soft)}
  .url{font-family:var(--mono);font-size:12px}
  .tlabel{font-size:12px;font-weight:700;margin:2px 0 6px}
  .tlabel em{font-style:normal;color:var(--muted);font-weight:500}
  .hint{font-size:11.5px;color:var(--muted);margin-top:7px;line-height:1.6}

  .notice{border:1px solid rgba(107,169,192,.32);background:rgba(107,169,192,.08);
    border-radius:10px;padding:13px 14px;font-size:12.5px;line-height:1.7;color:#C3DCE6;margin-top:16px}
  .notice b{color:#E6F3F8}
  .notice.hot{border-color:rgba(224,119,108,.4);background:rgba(194,69,61,.09);color:#EFC9C4}
  .notice.hot b{color:#FBE6E3}

  .lrow{display:flex;align-items:center;gap:9px;padding:12px 0;border-bottom:1px solid var(--line)}
  .lrow .n{font-size:15.5px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lrow .pin{font-family:var(--mono);font-size:16px;font-weight:700;color:var(--seal-soft);letter-spacing:.14em}
  .lrow button{border:1px solid var(--line);background:transparent;color:var(--paper);
    font-family:var(--sans);font-size:12.5px;font-weight:700;padding:9px 12px;border-radius:8px;cursor:pointer;flex:none}
  .lrow button:hover{background:rgba(242,233,216,.07)}
  .lrow button.ok{color:var(--seal-soft);border-color:rgba(224,119,108,.5)}
  .grouplabel{font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--muted);
    margin:22px 0 2px;padding-bottom:8px;border-bottom:1px solid rgba(242,233,216,.28)}

  .pick{width:100%;display:flex;align-items:center;gap:12px;text-align:left;background:transparent;
    border:0;border-bottom:1px solid var(--line);padding:15px 4px;color:var(--paper);
    font-family:var(--sans);font-size:17px;font-weight:600;cursor:pointer;transition:padding-left .16s ease}
  .pick:hover{padding-left:11px;color:#fff}
  .pick .arrow{margin-left:auto;color:var(--muted);font-size:13px}

  .pinbox{text-align:center;padding-top:16px}
  .pinbox input{width:200px;margin:26px auto 0;display:block;background:rgba(242,233,216,.05);
    border:1px solid var(--line);border-radius:12px;color:var(--paper);font-family:var(--mono);
    font-size:30px;font-weight:700;letter-spacing:.35em;text-align:center;padding:16px 10px 16px 20px;outline:0}
  .pinbox input:focus{border-color:var(--seal-soft)}
  .pinerr{color:var(--seal-soft);font-size:13px;margin-top:14px;min-height:20px}

  .reveal{text-align:center}
  .drawer{font-size:15px;color:var(--muted);margin-top:20px}
  .drawer b{color:var(--paper);font-weight:800;font-size:19px}
  .warn{font-size:12.5px;color:var(--muted);margin-top:6px}
  .slipzone{margin:30px 0 8px;display:flex;justify-content:center;perspective:900px}
  .slip{width:100%;max-width:320px;background:var(--paper);color:var(--ink);border-radius:5px;
    box-shadow:0 22px 44px rgba(0,0,0,.55),0 2px 0 rgba(255,255,255,.35) inset;cursor:pointer;
    position:relative;overflow:hidden;transform-origin:center bottom;
    display:flex;align-items:center;justify-content:center}
  .slip.folded{height:100px;transform:rotateX(5deg)}
  .slip.folded::before,.slip.folded::after{content:"";position:absolute;left:0;right:0;height:1px;background:rgba(36,31,46,.14)}
  .slip.folded::before{top:33px;box-shadow:0 1px 0 rgba(255,255,255,.6)}
  .slip.folded::after{top:67px;box-shadow:0 1px 0 rgba(255,255,255,.6)}
  .slip.open{min-height:300px;cursor:default;align-items:stretch;animation:unfold .5s cubic-bezier(.16,1,.3,1)}
  @keyframes unfold{from{transform:rotateX(30deg) scaleY(.55);opacity:.35}to{transform:none;opacity:1}}
  .seal{width:46px;height:46px;border-radius:50%;background:var(--seal);color:#F6E7E4;
    display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:10px;
    box-shadow:0 3px 8px rgba(0,0,0,.35);z-index:2}
  .slip.open .seal{display:none}
  .inner{padding:26px 22px;text-align:center;width:100%;animation:fadein .4s ease .16s both}
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  .slip.folded .inner{display:none}
  .inner .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.22em;color:#8A8095}
  .inner .who{font-size:33px;font-weight:800;letter-spacing:-.03em;margin:12px 0 6px;word-break:keep-all;line-height:1.15}
  .inner .tag{display:inline-block;font-size:11px;font-family:var(--mono);letter-spacing:.1em;color:var(--seal);
    border:1px solid rgba(194,69,61,.4);border-radius:99px;padding:4px 11px}
  .mission{margin-top:22px;padding-top:18px;border-top:1px dashed rgba(36,31,46,.25);text-align:left}
  .mission h5{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:#8A8095;margin-bottom:11px;text-align:center}
  .mission ol{list-style:none;counter-reset:m}
  .mission li{counter-increment:m;position:relative;padding-left:26px;font-size:13.5px;font-weight:600;
    line-height:1.55;margin-bottom:11px;word-break:keep-all}
  .mission li::before{content:counter(m);position:absolute;left:0;top:1px;width:18px;height:18px;
    border-radius:50%;background:var(--seal);color:#F6E7E4;font-family:var(--mono);font-size:10px;
    display:flex;align-items:center;justify-content:center}
  .rules{margin-top:22px;padding-top:16px;border-top:1px dashed rgba(36,31,46,.25);
    font-size:11.5px;line-height:1.85;color:#5B5468;text-align:left}
  .tap{font-family:var(--mono);font-size:11px;letter-spacing:.18em;color:var(--muted);margin-top:6px}
  .bad{text-align:center;padding:60px 0}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}}
</style>

<div class="wrap"><div id="app"></div></div>

<script>
(function(){
  var OBF='nangman-ppaji-2026';
  var DEF_M=['지훈','형준','현진','상현','우상','현기'];
  var DEF_F=['지윤','유리','유정','정아','유정(빠지반장)','예은'];
  var DEF_CORE=[
    '마니또와 함께 찍힌 사진 1장 이상 남기기',
    '마니또 2회 이상 챙겨주기 (뭘 했는지 기억 필수)',
    '마니또의 취미 · 사는 곳 알아내기',
    '마니또와 인스타 교환하기',
    '마니또와 하이파이브 하기'];
  var DEF_BONUS=[
    '마니또와 둘만 나오게 셀카 찍기','마니또 MBTI 알아내기','마니또를 한 번 이상 크게 웃기기',
    '마니또와 단둘이 5분 이상 대화하기','티 안 나게 마니또 칭찬 3번 하기','마니또가 잘 나온 사진 몰래 찍어두기',
    '마니또와 가위바위보 3판 하기','마니또의 최애 음식 알아내기','마니또가 가고 싶어 하는 여행지 알아내기',
    '마니또에게 마실 것 자연스럽게 챙겨주기','마니또와 건배 한 번 하기','마니또의 인생 노래 알아내기',
    '단체사진에서 마니또 옆자리 차지하기','마니또의 별명 알아내기','마니또에게 사진 찍어달라고 부탁하기',
    '마니또와 똑같은 포즈로 사진 찍기','마니또의 주말 루틴 알아내기','마니또의 형제자매 관계 알아내기',
    '마니또에게 간식 하나 챙겨주기','마니또와 같은 팀 · 같은 조 되어보기','마니또 이름 뜻 물어보기',
    '마니또에게 오늘 스타일 칭찬 한마디 건네기','마니또와 어깨동무하고 사진 찍기','마니또가 하는 일 알아내기'];

  var S={m:DEF_M.slice(),f:DEF_F.slice(),core:DEF_CORE.slice(),bonus:DEF_BONUS.slice(),
         base:'',room:null,pins:null,code:'',busy:false,err:'',
         who:-1,pin:'',pinErr:'',card:null,open:false};

  /* ---------- 인코딩 ---------- */
  function b64(u8){var s='';for(var i=0;i<u8.length;i++)s+=String.fromCharCode(u8[i]);
    return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
  function ub64(t){var s=t.replace(/-/g,'+').replace(/_/g,'/');var b=atob(s),a=new Uint8Array(b.length);
    for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
  function pack(o){var b=new TextEncoder().encode(JSON.stringify(o)),a=new Uint8Array(b.length);
    for(var i=0;i<b.length;i++)a[i]=b[i]^OBF.charCodeAt(i%OBF.length);return b64(a);}
  function unpack(t){try{var a=ub64(t);for(var i=0;i<a.length;i++)a[i]^=OBF.charCodeAt(i%OBF.length);
    return JSON.parse(new TextDecoder().decode(a));}catch(e){return null;}}

  /* ---------- 암호 ---------- */
  var SC=(window.crypto&&window.crypto.subtle)?window.crypto.subtle:null;
  function keyOf(pin,salt,i){
    var e=new TextEncoder();
    return SC.importKey('raw',e.encode(pin+'|'+salt),'PBKDF2',false,['deriveKey'])
      .then(function(k){return SC.deriveKey(
        {name:'PBKDF2',salt:e.encode(salt+'#'+i),iterations:180000,hash:'SHA-256'},
        k,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);});
  }
  function ivOf(salt,i){
    return SC.digest('SHA-256',new TextEncoder().encode('iv|'+salt+'|'+i))
      .then(function(h){return new Uint8Array(h).slice(0,12);});
  }
  function seal(txt,pin,salt,i){
    return Promise.all([keyOf(pin,salt,i),ivOf(salt,i)]).then(function(r){
      return SC.encrypt({name:'AES-GCM',iv:r[1]},r[0],new TextEncoder().encode(txt))
        .then(function(c){return b64(new Uint8Array(c));});
    });
  }
  function unseal(ct,pin,salt,i){
    return Promise.all([keyOf(pin,salt,i),ivOf(salt,i)]).then(function(r){
      return SC.decrypt({name:'AES-GCM',iv:r[1]},r[0],ub64(ct))
        .then(function(p){return new TextDecoder().decode(p);});
    });
  }

  function esc(s){return String(s).replace(/[&<>"']/g,function(c){
    return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
  function range(n){var a=[];for(var i=0;i<n;i++)a.push(i);return a;}
  function bij(n,l){var p=[];while(p.length<n)p=p.concat(shuffle(range(l)));return p.slice(0,n);}
  function rnd(n){var a=new Uint8Array(n);crypto.getRandomValues(a);return b64(a);}
  function pin4(){var a=new Uint32Array(1);crypto.getRandomValues(a);return String(1000+(a[0]%9000));}

  /* ---------- 뽑기 ---------- */
  function build(){
    var nm=S.m.length,nf=S.f.length,mp,fp,ok;
    for(var t=0;t<900;t++){
      mp=bij(nm,nf);fp=bij(nf,nm);ok=true;
      if(nm>1&&nf>1)for(var i=0;i<nm;i++){if(fp[mp[i]]===i){ok=false;break;}}
      if(ok)break;
    }
    var ns=S.m.concat(S.f),gs=[],tg=[];
    for(var a=0;a<nm;a++){gs.push('M');tg.push(nm+mp[a]);}
    for(var b=0;b<nf;b++){gs.push('F');tg.push(fp[b]);}

    var c=S.core.filter(Boolean),bo=S.bonus.filter(Boolean),pool=[],mi=[];
    ns.forEach(function(){
      var src=c.length?c:bo, one=src[Math.floor(Math.random()*src.length)]||'';
      var three=shuffle([one].concat(shuffle(bo.filter(function(x){return x!==one;})).slice(0,2)).filter(Boolean));
      mi.push(three.map(function(x){var k=pool.indexOf(x);if(k<0){pool.push(x);k=pool.length-1;}return k;}));
    });

    var salt=rnd(9), pins=ns.map(function(){return pin4();});
    return Promise.all(ns.map(function(_,i){
      return seal(tg[i]+','+mi[i].join(','),pins[i],salt,i);
    })).then(function(cts){
      return {room:{v:3,s:salt,ns:ns,gs:gs,mp:pool,ct:cts},pins:pins};
    });
  }

  function baseUrl(){return (S.base.trim()?S.base.trim().split('#')[0]:location.origin+location.pathname);}
  function roomLink(){return baseUrl()+'#'+S.code;}
  function dmMsg(i){
    return S.room.ns[i]+'님, 낭만빠지 마니또 결과 나왔어요! \uD83C\uDF0A\n\n'+
      '\u2460 아래 링크 접속\n\u2461 본인 이름 누르기\n\u2462 비밀번호 '+S.pins[i]+' 입력\n\n'+
      '비밀번호는 본인만 알고 계세요.\n다른 사람 이름을 눌러도 절대 안 열립니다.\n\n'+roomLink();
  }
  function roomMsg(){
    return '\uD83C\uDF0A 낭만빠지 마니또 \uD83C\uDF0A\n\n'+
      '아래 링크에서 본인 이름을 누르고,\n개인톡으로 받은 비밀번호를 넣으면\n마니또와 미션 3개가 나옵니다.\n\n'+
      '\u23F0 8/8(토) 19:00 ~ 공개 전까지\n\uD83D\uDE08 마니또한테 들키면 벌칙\n\n'+roomLink();
  }

  function legacy(t,cb,f){var ta=document.createElement('textarea');ta.value=t;
    ta.style.position='fixed';ta.style.top='0';ta.style.opacity='0';document.body.appendChild(ta);
    ta.focus();ta.select();var o=false;try{o=document.execCommand('copy');}catch(e){}
    document.body.removeChild(ta);o?cb():f();}
  function copy(text,btn){
    var l=btn.textContent;
    var ok=function(){btn.textContent='복사됨 \u2713';btn.classList.add('ok');
      setTimeout(function(){btn.textContent=l;btn.classList.remove('ok');},1600);};
    var no=function(){btn.textContent='복사 실패';setTimeout(function(){btn.textContent=l;},1600);};
    if(navigator.clipboard&&navigator.clipboard.writeText)
      navigator.clipboard.writeText(text).then(ok).catch(function(){legacy(text,ok,no);});
    else legacy(text,ok,no);
  }

  /* ---------- 주최자 ---------- */
  function vCreate(){
    function col(t,k){
      return '<div class="col"><h4>'+t+'</h4>'+S[k].map(function(n,i){
        return '<div class="nrow"><span>'+String(i+1).padStart(2,'0')+'</span>'+
               '<input value="'+esc(n)+'" data-k="'+k+'" data-i="'+i+'"></div>';}).join('')+
        '<button class="btn ghost" data-add="'+k+'" style="margin-top:8px;padding:8px;font-size:12px">+ 추가</button></div>';
    }
    return '<div class="eyebrow">Organizer</div><h1>낭만빠지 마니또 만들기</h1>'+
      '<p class="sub">남자는 여자를, 여자는 남자를 뽑습니다. 사람마다 비밀번호가 따로 생기고, 결과는 그 비밀번호로만 열립니다.</p>'+
      '<div class="hr"></div><div class="cols">'+col('남자','m')+col('여자','f')+'</div>'+
      '<details><summary>미션 목록 수정</summary><div class="pad">'+
        '<div class="tlabel">기본 미션 <em>— 여기서 1개 배정</em></div>'+
        '<textarea id="core" style="min-height:120px">'+esc(S.core.join('\n'))+'</textarea>'+
        '<div class="tlabel" style="margin-top:14px">추가 미션 <em>— 여기서 2개 배정</em></div>'+
        '<textarea id="bonus" style="min-height:200px">'+esc(S.bonus.join('\n'))+'</textarea>'+
        '<div class="hint">한 줄에 미션 하나</div></div></details>'+
      '<details><summary>링크 주소 설정 <em style="font-style:normal;color:var(--seal-soft)">중요</em></summary><div class="pad">'+
        '<input class="url" id="base" value="'+esc(S.base)+'" placeholder="https://numberoftwilight.github.io/manito.io/">'+
        '<div class="hint">이 파일이 올라가 있는 실제 주소. 비워두면 지금 보고 있는 주소를 씁니다.</div></div></details>'+
      '<button class="btn" id="go" '+(S.busy?'disabled':'')+'>'+(S.busy?'암호 만드는 중…':'마니또 뽑고 링크 만들기')+'</button>'+
      '<div class="notice"><b>결과는 이 화면에 나오지 않습니다.</b><br>뽑기는 이 브라우저 안에서만 돌고, 각자 결과는 본인 비밀번호로 암호화됩니다. 주최자도 비밀번호를 넣어 열기 전까지 아무것도 못 봐요.</div>'+
      (S.err?'<div class="hint" style="color:var(--seal-soft);text-align:center">'+esc(S.err)+'</div>':'');
  }

  function vRoom(){
    var h='<div class="eyebrow">Step 2</div><h1>링크와 비밀번호</h1>'+
      '<p class="sub">링크는 하나입니다. 비밀번호만 각자에게 따로 보내면 돼요.</p>'+
      '<div class="notice hot"><b>이 화면을 새로고침하면 비밀번호를 다시 볼 수 없습니다.</b><br>먼저 아래 &lsquo;비밀번호 목록 복사&rsquo;를 눌러 메모장에 붙여두세요.</div>'+
      '<button class="btn ok" id="cRoom">단톡방 문구 복사 (링크 포함)</button>'+
      '<button class="btn ghost" id="cList">비밀번호 목록 복사 (백업용)</button>';
    ['남자','여자'].forEach(function(t,gi){
      h+='<div class="grouplabel">'+t+'</div>';
      S.room.ns.forEach(function(n,i){
        if((gi===0)!==(S.room.gs[i]==='M'))return;
        h+='<div class="lrow"><span class="n">'+esc(n)+'</span>'+
           '<span class="pin">'+S.pins[i]+'</span>'+
           '<button data-dm="'+i+'">개인톡 문구</button></div>';
      });
    });
    h+='<div class="notice">본인 것도 목록에 있습니다. 다른 사람 것 다 보내고 <b>맨 마지막에</b> 본인 비밀번호로 열어보세요.</div>'+
       '<button class="btn ghost" id="again">전부 다시 뽑기</button>'+
       '<button class="btn ghost" id="back">이름 · 미션 수정하기</button>';
    return h;
  }

  /* ---------- 참가자 ---------- */
  function vPick(room){
    var h='<div class="eyebrow">Nangman Ppaji Manito</div><h1>본인 이름을 누르세요</h1>'+
      '<p class="sub">개인톡으로 받은 비밀번호가 있어야 열립니다. 남의 이름을 눌러도 열리지 않아요.</p>';
    ['남자','여자'].forEach(function(t,gi){
      h+='<div class="grouplabel">'+t+'</div>';
      room.ns.forEach(function(n,i){
        if((gi===0)!==(room.gs[i]==='M'))return;
        h+='<button class="pick" data-who="'+i+'"><span>'+esc(n)+'</span><span class="arrow">\u2192</span></button>';
      });
    });
    return h;
  }

  function vPin(room){
    return '<div class="pinbox"><div class="eyebrow">Locked</div>'+
      '<h1>'+esc(room.ns[S.who])+'님</h1>'+
      '<p class="sub">개인톡으로 받은 4자리 비밀번호를 넣어주세요.</p>'+
      '<input id="pin" type="tel" inputmode="numeric" maxlength="4" placeholder="\u2022\u2022\u2022\u2022" value="'+esc(S.pin)+'">'+
      '<div class="pinerr">'+esc(S.pinErr)+'</div>'+
      '<button class="btn" id="unlock" '+(S.busy?'disabled':'')+'>'+(S.busy?'여는 중…':'쪽지 열기')+'</button>'+
      '<button class="btn ghost" id="pback">\u2190 이름 다시 고르기</button></div>';
  }

  function vReveal(d){
    var g=d.g==='F'?'여자':'남자';
    return '<div class="reveal">'+
      '<div class="eyebrow">Nangman Ppaji Manito</div>'+
      '<div class="drawer"><b>'+esc(d.n)+'</b>님의 쪽지</div>'+
      '<div class="warn">'+(S.open?'주변에 보이지 않게 조심하세요':'준비되면 쪽지를 눌러 펼치세요')+'</div>'+
      '<div class="slipzone"><div class="slip '+(S.open?'open':'folded')+'" id="slip">'+
        '<div class="seal">封</div><div class="inner">'+
          '<div class="lbl">YOUR MANITO</div><div class="who">'+esc(d.t)+'</div>'+
          '<div class="tag">'+g+' · 끝까지 비밀</div>'+
          '<div class="mission"><h5>MISSION</h5><ol>'+
            d.ms.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ol></div>'+
          '<div class="rules">기간 · 8/8(토) 19:00 ~ 공개 전까지<br>'+
          '미션 3개 모두 수행 · 마니또에게 들키면 벌칙<br>'+
          '나를 챙겨주는 사람을 알아내면 그 사람 벌칙<br>'+
          '선물 준비 없음, 마음만 준비</div>'+
        '</div></div></div>'+
      (S.open?'':'<div class="tap">TAP TO OPEN</div>')+
      (S.open?'<p class="sub" style="text-align:center;margin-top:18px">캡처해두면 나중에 다시 볼 수 있어요.<br>비밀번호만 기억하면 언제든 다시 열립니다.</p>':'')+
      '<button class="btn ghost" id="pback">\u2190 처음으로</button></div>';
  }

  function vBad(msg){return '<div class="bad"><div class="eyebrow">Error</div>'+
    '<h1 style="font-size:21px">'+(msg||'링크가 올바르지 않아요')+'</h1>'+
    '<p class="sub">주소가 중간에 잘렸을 수 있어요. 링크를 처음부터 끝까지 통째로 복사해서 다시 열어주세요.</p></div>';}

  /* ---------- render ---------- */
  function render(){
    var app=document.getElementById('app'), hash=decodeURIComponent(location.hash.slice(1));
    if(!SC){app.innerHTML=vBad('이 브라우저에서는 열 수 없어요');return;}
    if(hash){
      var room=unpack(hash);
      if(!room||!room.ns){app.innerHTML=vBad();return;}
      if(S.card)app.innerHTML=vReveal(S.card);
      else if(S.who>=0)app.innerHTML=vPin(room);
      else app.innerHTML=vPick(room);
      bindGuest(room);
      return;
    }
    app.innerHTML=S.room?vRoom():vCreate();
    bindHost();
  }

  function bindGuest(room){
    var q=function(s){return document.querySelector(s);};
    document.querySelectorAll('[data-who]').forEach(function(b){
      b.onclick=function(){S.who=+this.dataset.who;S.pin='';S.pinErr='';render();
        var el=document.getElementById('pin');if(el)el.focus();};});
    var pi=q('#pin');
    if(pi){pi.oninput=function(){S.pin=this.value.replace(/\D/g,'').slice(0,4);this.value=S.pin;};
      pi.onkeydown=function(e){if(e.key==='Enter')q('#unlock').click();};}
    if(q('#unlock'))q('#unlock').onclick=function(){
      if(S.pin.length<4){S.pinErr='4자리를 다 넣어주세요.';render();return;}
      S.busy=true;S.pinErr='';render();
      unseal(room.ct[S.who],S.pin,room.s,S.who).then(function(txt){
        var p=txt.split(',').map(Number);
        S.card={n:room.ns[S.who],t:room.ns[p[0]],g:room.gs[p[0]],
                ms:[p[1],p[2],p[3]].map(function(x){return room.mp[x];})};
        S.busy=false;S.open=false;render();
      }).catch(function(){
        S.busy=false;S.pinErr='비밀번호가 맞지 않아요.';S.pin='';render();});
    };
    var sl=q('#slip');
    if(sl)sl.onclick=function(){if(!S.open){S.open=true;render();}};
    if(q('#pback'))q('#pback').onclick=function(){S.who=-1;S.pin='';S.pinErr='';S.card=null;S.open=false;render();};
  }

  function bindHost(){
    var q=function(s){return document.querySelector(s);};
    document.querySelectorAll('input[data-k]').forEach(function(i){
      i.oninput=function(){S[this.dataset.k][+this.dataset.i]=this.value;};});
    document.querySelectorAll('[data-add]').forEach(function(b){
      b.onclick=function(){S[this.dataset.add].push('');render();};});
    if(q('#core'))q('#core').oninput=function(){S.core=this.value.split('\n').map(function(s){return s.trim();}).filter(Boolean);};
    if(q('#bonus'))q('#bonus').oninput=function(){S.bonus=this.value.split('\n').map(function(s){return s.trim();}).filter(Boolean);};
    if(q('#base'))q('#base').oninput=function(){S.base=this.value;};

    function go(){
      S.m=S.m.map(function(s){return s.trim();}).filter(Boolean);
      S.f=S.f.map(function(s){return s.trim();}).filter(Boolean);
      if(!S.m.length||!S.f.length){S.err='남자와 여자 모두 한 명 이상 필요해요.';render();return;}
      S.err='';S.busy=true;render();
      build().then(function(r){S.room=r.room;S.pins=r.pins;S.code=pack(r.room);S.busy=false;render();})
             .catch(function(){S.busy=false;S.err='만들기에 실패했어요. 새로고침 후 다시 시도해주세요.';render();});
    }
    if(q('#go'))q('#go').onclick=go;
    if(q('#again'))q('#again').onclick=function(){
      if(confirm('전부 새로 뽑습니다. 이미 보낸 링크와 비밀번호는 무효가 돼요.')){S.room=null;go();}};
    if(q('#back'))q('#back').onclick=function(){
      if(confirm('링크와 비밀번호가 사라집니다. 계속할까요?')){S.room=null;S.pins=null;S.code='';render();}};
    if(q('#cRoom'))q('#cRoom').onclick=function(){copy(roomMsg(),this);};
    if(q('#cList'))q('#cList').onclick=function(){
      copy('낭만빠지 마니또 비밀번호\n'+roomLink()+'\n\n'+
        S.room.ns.map(function(n,i){return n+' : '+S.pins[i];}).join('\n'),this);};
    document.querySelectorAll('[data-dm]').forEach(function(b){
      b.onclick=function(){copy(dmMsg(+this.dataset.dm),this);};});
  }

  window.addEventListener('hashchange',function(){S.who=-1;S.pin='';S.card=null;S.open=false;render();});
  render();
})();
</script>
